services:
  db:
    image: postgres:16-alpine
    container_name: college-notes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_notes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d college_notes"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local development.
  #
  # The app stores note files in S3 and hands out presigned URLs; without a
  # bucket behind those URLs, uploading, downloading and previewing a file
  # cannot be exercised locally at all. MinIO speaks the same API, so the code
  # path under test is the real one — only the endpoint differs (S3_ENDPOINT in
  # backend/.env). Nothing here is reachable from production.
  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: college-notes-storage
    # The bucket is a top-level directory in MinIO's data dir, so creating it
    # before the server starts is enough. A separate one-shot init container
    # would work too, but it exits — and `docker compose up --wait`, which
    # `make local-up` uses, treats an exited service as a failed start.
    # entrypoint, not command: the image's own entrypoint is `minio`, so a
    # shell wrapper passed as command is read as a minio sub-command.
    entrypoint: sh -c "mkdir -p /data/college-notes && minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Not a long-running service — `profiles` keeps it out of `docker compose up`
  # entirely; it only runs via `docker compose run --rm migrate <up|down 1|...>`
  # (see the Makefile's local-migrate-* targets). Same golang-migrate image and
  # migrations/ directory used against Neon, so local dev exercises the exact
  # mechanism staging/production use — only the connection target differs, and
  # here it's the compose service name "db", resolved by Docker's own network,
  # not "localhost" (a sibling container's localhost is itself, not the host).
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgresql://postgres:postgres@db:5432/college_notes?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  miniodata:
  pgdata:
