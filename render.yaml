services:
  - type: web
    name: revisex-backend
    runtime: node
    plan: starter
    region: oregon
    # Deploys are triggered by .github/workflows/ci.yml's deploy-backend job
    # (via this service's Deploy Hook URL) only after tests pass, not by
    # every push Render sees.
    autoDeploy: false
    # db/ is a sibling package backend/ imports by relative path
    # (backend/src/db/index.ts -> ../../../db/dist/schema/index.js), so both
    # must be built from the repo root, not from backend/ alone.
    buildCommand: cd db && npm ci && npm run build && cd ../backend && npm ci && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Comma-separated list — production frontend domain plus any Vercel
      # preview domains you want to allow.
      - key: CORS_ORIGIN
        sync: false
      # Neon POOLED connection string (hostname contains "-pooler").
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: OAUTH_TOKEN_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
